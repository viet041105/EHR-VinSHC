# Local development/test baseline. Image updates must also update config/baseline.json.
services:
  db:
    image: postgres:16.15-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    restart: unless-stopped
    environment:
      POSTGRES_DB: openmrs
      POSTGRES_USER: ${OMRS_DB_USER:?Run python scripts/bootstrap.py first}
      POSTGRES_PASSWORD: ${OMRS_DB_PASSWORD:?Run python scripts/bootstrap.py first}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro

  backend:
    image: ehr-vinshc-backend:3.7.1-postgresql
    build:
      context: ./infra/backend
      dockerfile: Dockerfile
    pull_policy: build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      OMRS_DB: postgresql
      OMRS_EXTRA_HIBERNATE_DIALECT: org.vinshc.hibernate.VinSHCPostgreSQLDialect
      OMRS_CONFIG_CONNECTION_PORT: "5432"
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES: "true"
      OMRS_CONFIG_CONNECTION_SERVER: db
      OMRS_CONFIG_CONNECTION_DATABASE: openmrs
      OMRS_CONFIG_CONNECTION_USERNAME: ${OMRS_DB_USER:?Run python scripts/bootstrap.py first}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${OMRS_DB_PASSWORD:?Run python scripts/bootstrap.py first}
      OMRS_CONFIG_ADMIN_USER_PASSWORD: ${EHR_ADMIN_PASSWORD:?Run python scripts/bootstrap.py first}
      OMRS_JAVA_MEMORY_OPTS: "-Xms256m -Xmx2048m"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://localhost:8080/openmrs/health/started"]
      interval: 15s
      timeout: 10s
      retries: 160
      start_period: 120s
    volumes:
      - openmrs-pg-data:/openmrs/data

  frontend:
    image: openmrs/openmrs-reference-application-3-frontend:3.7.1@sha256:f6b1f8443ab27a6b1c3944c5a948f2e0cdfea3701dcfd59316677fef28a58f8d
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SPA_PATH: /openmrs/spa
      API_URL: /openmrs
      SPA_CONFIG_URLS: ""
      SPA_DEFAULT_LOCALE: ${SPA_DEFAULT_LOCALE:-en}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  vinshc-fe:
    profiles: ["fe"]
    image: python:3.14.8-slim-bookworm@sha256:48b13b003dda20b16f9442b8475aa05fe21bf6579a8c881db92ffb4d8fd20f83
    working_dir: /app
    volumes: ["./frontend:/app:ro"]
    ports: ["127.0.0.1:5173:5173"]
    command: ["python3", "-m", "http.server", "5173", "--bind", "0.0.0.0"]

  gateway:
    image: openmrs/openmrs-reference-application-3-gateway:3.7.1@sha256:49070abbcda8aeced46f78ce0c1559236a2ba45bc624fe8485a59220cbd159a2
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EHR_HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/openmrs/spa/index.html"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
  openmrs-pg-data:
