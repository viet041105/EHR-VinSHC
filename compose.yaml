# Local development/test baseline. Image updates must also update config/baseline.json.
services:
  db:
    image: mariadb:10.11.19@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: openmrs
      MARIADB_USER: ${OMRS_DB_USER:?Run python scripts/bootstrap.py first}
      MARIADB_PASSWORD: ${OMRS_DB_PASSWORD:?Run python scripts/bootstrap.py first}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run python scripts/bootstrap.py first}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    volumes:
      - db-data:/var/lib/mysql

  backend:
    image: ehr-vinshc-backend:3.7.1-baseline
    build:
      context: ./infra/backend
      dockerfile: Dockerfile
    pull_policy: build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES: "true"
      OMRS_CONFIG_CONNECTION_SERVER: db
      OMRS_CONFIG_CONNECTION_DATABASE: openmrs
      OMRS_CONFIG_CONNECTION_USERNAME: ${OMRS_DB_USER:?Run python scripts/bootstrap.py first}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${OMRS_DB_PASSWORD:?Run python scripts/bootstrap.py first}
      OMRS_CONFIG_ADMIN_USER_PASSWORD: ${EHR_ADMIN_PASSWORD:?Run python scripts/bootstrap.py first}
      OMRS_JAVA_MEMORY_OPTS: "-Xms256m -Xmx2048m"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://localhost:8080/openmrs/health/started"]
      interval: 15s
      timeout: 10s
      retries: 80
      start_period: 120s
    volumes:
      - openmrs-data:/openmrs/data

  frontend:
    image: openmrs/openmrs-reference-application-3-frontend:3.7.1@sha256:f6b1f8443ab27a6b1c3944c5a948f2e0cdfea3701dcfd59316677fef28a58f8d
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SPA_PATH: /openmrs/spa
      API_URL: /openmrs
      SPA_CONFIG_URLS: ""
      SPA_DEFAULT_LOCALE: ${SPA_DEFAULT_LOCALE:-en}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  gateway:
    image: openmrs/openmrs-reference-application-3-gateway:3.7.1@sha256:49070abbcda8aeced46f78ce0c1559236a2ba45bc624fe8485a59220cbd159a2
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EHR_HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/openmrs/spa/index.html"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  db-data:
  openmrs-data:
