name: Agent and clinic MVP
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -c infra/agent/constraints.txt -e 'infra/agent[dev,anthropic]'
      - run: python -m pytest infra/agent/tests -q
      - run: python infra/agent/src/main.py --check
      - run: docker build -f infra/agent/Dockerfile -t vinshc-agent:ci .
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/frontend/package-lock.json
      - working-directory: infra/frontend
        run: npm ci
      - working-directory: infra/frontend
        run: npm test && npm run test:api && npm run build
      - working-directory: infra/frontend
        run: npx playwright install --with-deps chromium
      - working-directory: infra/frontend
        run: npm run test:agent-browser
