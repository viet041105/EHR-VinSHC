name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    name: Configuration and tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Create isolated test settings
        run: python scripts/bootstrap.py
      - name: Validate Compose and pinned baseline
        run: python scripts/check_config.py
      - name: Test bootstrap and smoke failure handling
        run: python -m unittest discover -s tests -v
      - name: Validate GitHub Actions workflow
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output /tmp/actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color

  smoke:
    name: B1-B9 PostgreSQL, API, FHIR, restart and restore
    needs: configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      COMPOSE_PROJECT_NAME: ehr-ci-${{ github.run_id }}-${{ github.run_attempt }}
      B9_RESTORE_PROJECT: ehr-ci-restore-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: compose.yaml:tests/integration/compose.b4-metadata.yaml
      EHR_HTTP_PORT: '8080'
      VINSHC_B4_CATALOGUE: metadata
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Create isolated test settings
        run: python scripts/bootstrap.py
      - name: Validate settings
        run: python scripts/check_config.py
      - name: Validate generated metadata and catalogue fixtures
        run: |
          python tools/metadata.py
          python -m unittest discover -s metadata/tests -v
      - name: Pull exact reviewed images
        run: docker compose pull --quiet --ignore-buildable
      - name: Build PostgreSQL-compatible backend from the fixed upstream release
        run: docker compose build --pull backend
      - name: Start a fresh stack and wait for readiness
        run: timeout 2400s docker compose up -d --wait --wait-timeout 2400
      - name: Verify PostgreSQL version, extensions and OpenMRS schema
        run: python scripts/check_database.py
      - name: Verify imported metadata before workflow tests
        run: >-
          python tools/metadata.py --verify-url http://127.0.0.1:8080/openmrs
          --report .runtime/reports/metadata-ci-before.json
      - name: Verify APIs and create synthetic patient and clinical data
        run: python scripts/smoke.py --create-fixture --report .runtime/reports/smoke-before.json
      - name: Verify ordered B1-B8 API, authorization, FHIR and MVP-2 contracts
        # Explicit order: test_b23 needs the B2/B3 fixtures, but discover sorts it before test_b2_.
        run: >-
          python -m unittest -v
          tests.integration.test_b1_contract tests.integration.test_b2_patient
          tests.integration.test_b3_vitals tests.integration.test_b23_extensions
          tests.integration.test_b4a_consultation tests.integration.test_b4b_clinical
          tests.integration.test_b5_authorization tests.integration.test_b7_fhir
          tests.integration.test_b8_operations
      - name: Recreate containers and retain named volumes
        run: |
          docker compose down
          timeout 600s docker compose up -d --wait --wait-timeout 600
      - name: Verify Initializer idempotency and all data after restart
        run: |
          python scripts/check_database.py
          python tools/metadata.py --verify-url http://127.0.0.1:8080/openmrs --report .runtime/reports/metadata-ci-after-restart.json
          python scripts/smoke.py --require-fixture --report .runtime/reports/smoke-after.json
          VINSHC_ACCEPTANCE_PHASE=restart python -m unittest -v tests.integration.test_b9_persistence
      - name: Back up the complete synthetic clinic
        run: >-
          python scripts/recovery.py backup
          --project "$COMPOSE_PROJECT_NAME"
          --output .runtime/backups/b9-ci
          --compose-file compose.yaml
          --compose-file tests/integration/compose.b4-metadata.yaml
          --wait-timeout 600
      - name: Restore into a different empty project
        run: >-
          python scripts/recovery.py restore
          --project "$B9_RESTORE_PROJECT"
          --input .runtime/backups/b9-ci
          --compose-file compose.yaml
          --compose-file tests/integration/compose.b4-metadata.yaml
          --http-port 18089
          --fixture .runtime/smoke-fixture.json
          --wait-timeout 1200
          --cleanup-on-failure
      - name: Verify metadata and workflow state after restore
        run: |
          python tools/metadata.py --verify-url http://127.0.0.1:18089/openmrs --report .runtime/reports/metadata-ci-after-restore.json
          EHR_HTTP_PORT=18089 VINSHC_ACCEPTANCE_PHASE=restore python -m unittest -v tests.integration.test_b9_persistence
      - name: Build redacted backend handoff evidence
        run: |
          python scripts/b9_handoff.py \
            --require-persistence restart \
            --require-persistence restore \
            --metadata-report .runtime/reports/metadata-ci-before.json \
            --metadata-report .runtime/reports/metadata-ci-after-restart.json \
            --metadata-report .runtime/reports/metadata-ci-after-restore.json \
            --recovery-report ".runtime/reports/b6-${B9_RESTORE_PROJECT}-recovery.json"
      - name: Collect redacted diagnostics
        if: always()
        run: python scripts/collect_diagnostics.py
      - name: Upload synthetic-stack reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: openmrs-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/reports/
          retention-days: 7
          if-no-files-found: warn
      - name: Remove only this CI run's containers and volumes
        if: always()
        run: |
          docker compose -p "$B9_RESTORE_PROJECT" down --volumes --remove-orphans
          docker compose -p "$COMPOSE_PROJECT_NAME" down --volumes --remove-orphans
