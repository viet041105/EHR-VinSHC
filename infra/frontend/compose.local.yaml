# FE overlay for the backend built from this repository (compose.yaml at the repo root).
# The pinned Maven builder currently targets amd64; Docker Desktop emulates it on Apple Silicon.
services:
  db:
    ports:
      - "127.0.0.1:15432:5432"
  backend:
    platform: linux/amd64
    image: vinshc-fe-local-backend:dev
