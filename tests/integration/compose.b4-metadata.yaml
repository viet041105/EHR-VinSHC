services:
  backend:
    volumes:
      - ./metadata/vinshc/initializer-test/concepts/vinshc/040-test-catalogues.csv:/openmrs/distribution/openmrs_config/concepts/vinshc/040-test-catalogues.csv:ro
      - ./metadata/vinshc/initializer-test/drugs/vinshc/medications.csv:/openmrs/distribution/openmrs_config/drugs/vinshc/medications.csv:ro
      - ./metadata/vinshc/initializer-test/encounterroles/vinshc/result-reviewer.csv:/openmrs/distribution/openmrs_config/encounterroles/vinshc/result-reviewer.csv:ro
      - ./metadata/vinshc/initializer-test/locations/vinshc/test-rooms.csv:/openmrs/distribution/openmrs_config/locations/vinshc/test-rooms.csv:ro
      - ./metadata/vinshc/initializer-test/orderfrequencies/vinshc/frequencies.csv:/openmrs/distribution/openmrs_config/orderfrequencies/vinshc/frequencies.csv:ro
